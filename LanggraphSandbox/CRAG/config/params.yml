llm:
  model: "gemini-3.8-flash"
  temperature: 0.7
  max_output_tokens: 5000

embeddings:
  model: "gemini-embedding-2"

document_splitting:
  chunk_size: 1000
  chunk_overlap: 200

retriever:
  search_type: "similarity"
  k: 4

paths:
  files_dir: "files"
  persist_directory: "chroma_store"
  use_existing_store: true
