llm:
  model: "gemini-3.8-flash"
  temperature: 0.7
  max_output_tokens: 5000

embeddings:
  model: "gemini-embedding-2"

document_splitting:
  chunk_size: 1000
  chunk_overlap: 200

retriever:
  search_type: "similarity"
  k: 5

evaluation:
  hit_min_threshold: 7.5
  miss_max_threshold: 3.5

paths:
  files_dir: "files"
  artifacts_dir: "artifacts"
  max_artifacts_runs: 50
  persist_directory: "chroma_store"
  use_existing_store: true

tracing:
  enabled: true
  project: "corrective-rag"

web_search:
  region: "us-en"
  max_results: 5
