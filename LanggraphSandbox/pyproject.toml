[project]
name = "langgraphsandbox"
version = "0.1.0"
description = "This is a playground repo where I test out Langgraph, LLMs (mainly Gemini), and RAG setups"
readme = "README.md"
requires-python = ">=3.11, <=3.15"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "pydantic",
    "python-dotenv",
    "rich",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "langchain-community>=0.4.2",
    "duckduckgo-search>=8.1.1",
    "langchain-experimental>=0.4.2",
    "ddgs>=9.16.1",
    "networkx>=3.6.1",
    "matplotlib>=3.11.2",
    "catppuccin>=2.5.0",
    "pytest>=9.2.0",
    "termcolor>=3.3.0",
    "streamlit>=1.66.1",
    "watchdog>=6.0.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "sympy>=1.14.0",
    "langchain-chroma>=1.1.0",
    "pypdf>=6.21.4",
    "langchain-unstructured>=1.0.1",
    "unstructured>=0.27.36",
    "docling>=2.146.0",
    "pymupdf>=2.1",
    "ipywidgets>=8.1.9",
]
